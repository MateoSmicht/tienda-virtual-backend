name: Spring Boot Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tienda_virtual
        ports:
          - 3306:3306
        # Este comando de salud es clave para que el test espere a que el motor de BD esté listo
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Tests con Maven
        # Forzamos las propiedades aquí mismo por si el archivo de resources no se está leyendo bien
        run: |
          mvn -B -e test \
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/tienda_virtual?allowPublicKeyRetrieval=true&useSSL=false \
          -Dspring.datasource.username=root \
          -Dspring.datasource.password=root \
          -Dmercadopago.access.token=test_token \
          -Dmercado.pago.webhook.url=http://localhost:8080