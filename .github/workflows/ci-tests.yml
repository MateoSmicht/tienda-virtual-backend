name: Spring Boot Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # MySQL 100% temporal y descartable
    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_DATABASE: tienda_virtual
          MYSQL_ROOT_PASSWORD: password_temporal_falsa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Tests con Maven
        # pasamos los datos falsos a Spring Boot solo por hoy
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/tienda_virtual?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: password_temporal_falsa
        run: mvn -B test --file pom.xml