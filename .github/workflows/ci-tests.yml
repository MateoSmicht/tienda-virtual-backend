name: Spring Boot Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Levantamos un MySQL temporal y descartable
    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_DATABASE: tienda_virtual
          MYSQL_ROOT_PASSWORD: password_temporal_falsa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Tests con Maven
        env:
          # 1. Credenciales de la BD temporal que creamos arriba
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/tienda_virtual?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: password_temporal_falsa

          # 2. Variables de entorno "falsas" para engañar a Spring Boot
          MERCADO_PAGO_WEBHOOK_URL: http://localhost:8080
          MERCADO_PAGO_TOKEN: token_falso_de_prueba
          JWT_SECRET: clave_secreta_falsa

        # -B (Batch mode), -e (Errors para ver el detalle exacto si falla)
        run: mvn -B -e test --file pom.xml